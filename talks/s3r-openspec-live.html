# Часть I. Picodata

= Приложение рядом с данными
!full /assets/img/talks/s3r/alfa-06.jpg
- | В привычной архитектуре приложение и база данных работают в разных процессах и общаются по сети.
- | Каждое обращение к данным в такой схеме стоит миллисекунды.
- | Если код работает в одном процессе с данными, то же обращение превращается в поиск по индексу в памяти и стоит порядка микросекунды.
!
в *1000* раз | Разница в тысячу раз даёт другой класс приложений.
!img /assets/img/talks/colocated.svg
транзакция рядом с данными | Границы транзакции в этом случае задаёт код, который стоит рядом с данными.
вы это уже делаете | Вам этот подход знаком, так работает ваш тарифный калькулятор, написанный на Rust внутри Tarantool.

= От узла к кластеру
!
один узел → *кластер* | Вопрос в том, что нужно добавить, чтобы один узел с модулем на Rust стал кластером.
!full /assets/img/talks/s3r/alfa-32.jpg
- | Во-первых, схема данных в Picodata одна на весь кластер и меняется распределённым DDL.
!img /assets/img/talks/buckets.svg
шардирование | Во-вторых, шардирование встроено в ядро: данные переезжают между узлами, а кластер продолжает работать.
!img /assets/img/talks/architecture.svg
Raft | В-третьих, за состав кластера и отказы узлов отвечает Raft в ядре, внешний координатор не нужен.
!img /assets/img/talks/sql_cloud.svg
SQL и протокол PostgreSQL | В-четвёртых, к тем же данным можно обратиться распределённым SQL по протоколу PostgreSQL.
!full /assets/img/talks/s3r/alfa-37.jpg
- | И наконец, сам код приложения становится плагином с манифестом, миграциями и версией.
!img /assets/img/talks/plugin_lifecycle.svg
`ALTER PLUGIN` | Плагин устанавливается и обновляется командой SQL, и две его версии могут работать в кластере одновременно.
!img /assets/img/talks/shard_per_core_trend.svg
обычный крейт Rust | При этом плагин остаётся обычным крейтом Rust с исходниками в git, сборкой через cargo, тестами и CI.

= Два вида таблиц
!fig tables all
два вида таблиц | Для скорости важнее всего различие между двумя видами таблиц, и сегодня я остановлюсь на нём подробнее.
!full /assets/img/talks/s3r/alfa-31.jpg
- | Глобальная таблица лежит на каждом узле кластера полностью.
!fig cluster g
запись через *Raft* | Запись в неё идёт через журнал Raft, через одного лидера на весь кластер.
чтение *локальное* | Зато читать её можно на любом узле, и это чтение из локальной памяти.
!full /assets/img/talks/s3r/alfa-30.jpg
- | В шардированной таблице каждая строка живёт на одном репликасете.
!fig cluster s
запись *масштабируется* | Запись в неё идёт в тот репликасет, который владеет ключом, и скорость записи растёт с числом узлов.
!fig cluster all
справочники и основной объём | Глобальные таблицы подходят для справочников и конфигурации, шардированные для основного объёма данных.

= Управление распределением
!img /assets/img/talks/distribution.svg
ключ распределения | Ключ, по которому шардируется таблица, выбирает разработчик, и он не обязан совпадать с первичным ключом.
одинаковый ключ → один репликасет | Строки с одинаковым ключом распределения лежат на одном репликасете, даже если это строки разных таблиц.
совместное распределение | Это называется совместным распределением.
!
транзакция =\*один* репликасет | Транзакция в Picodata работает в пределах одного репликасета.
атомарно →\*рядом* | Поэтому всё, что должно меняться атомарно, получает один ключ распределения.
быстро →\*с ключом* | Запрос с известным ключом идёт на один узел, а запрос, в котором ключа нет, обходит весь кластер.
ключ определяет\*атомарность*\и *скорость* | Выбор ключа распределения определяет и то, что будет атомарным, и то, что будет быстрым.

# Часть II. S3 как задача

= Зачем ещё одно хранилище
!side /assets/img/talks/s3r/datacenter-ring.webp
Lakehouse\и ИИ | Объектное хранилище сегодня это основа Lakehouse и задач искусственного интеллекта.
гигабайты Parquet\+\миллионы\мелких файлов | В такой нагрузке рядом с большими файлами Parquet лежат миллионы мелких файлов с метаданными таблиц.
!full /assets/img/talks/s3r/s3r-04.jpg
- | Диски с такой нагрузкой справляются, предел задаёт слой метаданных.
- | В классических хранилищах сервис метаданных один, и растёт он только вертикально.
- | Листинг большой директории опрашивает все наборы дисков и сливает результаты.
- | А файл в один килобайт читается с дисков так же тяжело, как файл в гигабайт.

= Идея S3R
!full /assets/img/talks/s3r/s3r-05.jpg
- | В S3R метаданные хранит распределённая СУБД, а содержимое объектов хранят локальные диски.
- | Плагин работает внутри процесса Picodata, поэтому рядом нет ни отдельного кластера метаданных, ни встроенной базы ключей.
- | Содержимое защищено кодами Рида-Соломона. Объект режется на полосы, полоса кодируется в блоки данных и блоки чётности.
!full /assets/img/talks/s3r/s3r-08.jpg
- | В плагине три сервиса. Первый принимает запросы S3, второй работает с таблицами, третий хранит блоки на дисках.
- | Все три работают в одном процессе, и на узле этот процесс один.
!full /assets/img/talks/s3r/s3r-06.jpg
- | Из такой архитектуры следуют три свойства. Первое это согласованность, успешная запись видна следующему чтению.
- | Второе свойство: пропускная способность по метаданным растёт с числом узлов.
- | Третье свойство: объект до четырёх килобайт хранится в строке метаданных и читается из памяти.

= Что должно уметь S3
!
S3 как *задача* | Теперь о том, что такое S3 как задача.
положить файл,\взять файл? | «Положить файл и взять файл» составляют малую часть протокола.
!full /assets/img/talks/s3r/s3r-13.jpg
- | Это версионирование, блокировка объектов, условная запись, составная загрузка, жизненный цикл, политики и CORS.
- | Совместимость мы измеряем набором тестов ceph s3-tests, и проходят все четыреста шестнадцать выбранных сценариев.
- | Приложение переключается на S3R сменой адреса и ключей доступа.
!full /assets/img/talks/s3r/s3r-15.jpg
- | Отдельная большая тема это мультитенантность. У арендатора свой домен, свой сертификат, свои ключи и свои квоты.
!fig checks
на каждом запросе | На каждом запросе хранилище обязано проверить подпись, арендатора, бакет, права, квоту и правила CORS.
*6* проверок до начала работы | Это шесть проверок до того, как началась сама работа, и все они обращаются к метаданным.
!
как сделать это\*быстро*? | Чтобы всё это работало быстро, данные нужно правильно разложить по кластеру.

= Что куда положить
!fig cluster g
глобальные таблицы | В глобальные таблицы мы кладём всё, что читается на каждом запросе и меняется редко.
!fig layout g1
арендаторы и ключи | Это арендаторы и их ключи доступа.
!fig layout g2
бакеты и их документы | Это бакеты вместе со своими документами: политикой, списком доступа, правилами CORS и жизненного цикла.
!fig layout g3
карта хранилища | Это карта хранилища: ярусы, диски и группы размещения.
!fig layout g
тысячи строк на каждом узле | Таких строк тысячи, в худшем случае сотни тысяч, и каждый узел держит их все.
!fig cluster s
шардированные таблицы | В шардированные таблицы мы кладём то, чего много: объекты, версии и директории.
миллиарды строк | Таких строк миллиарды, и запись в них идёт на каждом PUT.
!fig layout s
почему не глобально | Сделать их глобальными нельзя. Каждая запись пошла бы через одного лидера Raft, а весь каталог пришлось бы держать в памяти каждого узла.
!fig layout t
у арендатора свои таблицы | У каждого арендатора свои таблицы, поэтому запрос одного арендатора физически не может назвать таблицу другого.

= Ключ распределения каталога
!
по какому ключу\шардировать *объекты*? | Теперь главный вопрос: по какому ключу шардировать объекты.
!fig key 1
вариант 1 | Первый вариант, по бакету и полному ключу объекта, даёт ровную нагрузку.
листинг = обход кластера | Но листинг директории тогда превращается в обход всего кластера и слияние результатов.
!fig key 2
вариант 2 | Второй вариант, по бакету и родительской директории, кладёт всю директорию на один репликасет.
листинг = один проход | Листинг становится одним упорядоченным проходом по индексу.
плоский бакет | Но плоский бакет, в котором нет директорий, при таком ключе попадает на один узел весь.
!fig key 3
вариант 3: фрагмент | Мы добавили в ключ третье поле, номер фрагмента, который вычисляется из имени объекта.
от 0 до 256 фрагментов | Число фрагментов задаётся на бакет, от нуля для бакета с директориями до двухсот пятидесяти шести для плоского.
число лежит в глобальной строке бакета | Лежит это число в глобальной строке бакета, поэтому узнать его при маршрутизации ничего не стоит.
!full /assets/img/talks/s3r/s3r-14.jpg
- | В результате стоимость страницы листинга не растёт с размером директории. Тысяча ключей читается за две с половиной миллисекунды.

= Совместное распределение ради транзакций
!
что будет\*атомарным*? | Второй вопрос к ключу: какие операции станут атомарными.
!fig mpu 0

естественный ключ: `upload_id` | Естественный ключ загрузки это её идентификатор.
загрузка и объект на разных узлах | Если шардировать по нему, загрузка и объект окажутся на разных узлах.
сбой между узлами | Сбой между ними оставит либо объект, которого нет в учёте, либо части, которые никто не соберёт.

!

= Applied global state
!
как быстро читать\глобальные таблицы? | Остаётся вопрос, как быстро читать глобальные таблицы.
они и так в памяти? | Они ведь и так лежат в памяти каждого узла.
!fig ags 0
два мира | Но запросы S3 обрабатывает пул потоков Tokio, а таблицы принадлежат одному транзакционному потоку.
чтение строки: 0,13 мкс | Само чтение строки стоит десятую долю микросекунды.
переход: 8 мкс в каждую сторону | А переход из потока обработчика в транзакционный поток стоит около восьми микросекунд в каждую сторону.
несколько переходов на запрос | И таких переходов на каждом запросе несколько.
!
*applied\global\state* | Мы сделали то, что назвали applied global state, применённое глобальное состояние.
!fig ags 1
неизменяемый снимок | Все решения Raft каждый узел держит в памяти одним неизменяемым снимком.
!fig ags 2
триггер → сборщик → указатель | Триггер на фиксацию транзакции запоминает изменённые строки, сборщик разбирает их и публикует новый снимок заменой одного указателя.
!fig ags 3
блокировок *нет* | Обработчик запроса берёт снимок один раз и читает его обычными обращениями к памяти. Блокировок нет.
!
в форме\*вопроса* | Данные в снимке лежат в форме вопроса. Список доступа, например, заранее скомпилирован в битовую маску.
`granted & wanted != 0` | Проверка прав превращается в одну побитовую операцию.
только целые\транзакции | Снимок содержит только зафиксированные транзакции, поэтому наполовину переименованный бакет увидеть нельзя.

# Часть III. Корректность

= Четыре атомарных среза
!
а теперь\о *трудном* | До сих пор всё выглядело хорошо, теперь о том, что в этой задаче трудно.
!fig slices 0
четыре среза состояния | У S3R четыре среза состояния, и каждый атомарен по-своему.
!fig slices 1
1. глобальные метаданные | Первый срез это глобальные метаданные, и их атомарность обеспечивает Raft.
!fig slices 2
2. каталог | Второй срез это каталог, строки объектов и директорий. Здесь атомарна транзакция в одном репликасете.
!fig slices 3
3. размещение | Третий срез это размещение. Оно говорит, какие блоки какой полосы лежат на каких дисках.
!fig slices 4
4. данные | Четвёртый срез это сами байты на дисках, и здесь атомарна только синхронная запись одного блока.
!fig slices 0
ни одна транзакция не покрывает два среза | Ни одна транзакция не покрывает два среза сразу.
!fig slices 5
запись объекта проходит через все четыре | А запись одного объекта проходит через все четыре.

= Объект как сага
!fig saga 0
сага из трёх шагов | Поэтому запись объекта у нас это сага из трёх шагов.
!fig saga 1
1. блоки | Сначала блоки записываются на диски.
!fig saga 2
2. директории | Затем создаются строки родительских директорий, и лежат они, возможно, на других узлах.
!fig saga 3
3. строка объекта | И в конце фиксируется строка объекта вместе с картой его блоков.
точка невозврата | Строка объекта это точка невозврата. До неё объекта нет, начиная с неё он есть.
!fig saga 0
остановка оставляет только мусор | Порядок выбран так, чтобы остановка на любом шаге оставляла только мусор, который можно найти и убрать.
!
каждый *префикс* саги\это допустимое состояние | Сага корректна тогда, когда каждый её префикс является допустимым состоянием.
занято по ошибке: *можно*\свободно по ошибке: *никогда* | Ошибаться можно только в одну сторону. Место может быть занято по ошибке, но не может быть по ошибке свободно.

!fig saga x1

!fig late 4

это *было* | Это ошибка из нашей истории, мы её нашли и исправили.

!fig rules 0
правила | Из таких случаев выросли правила, на которых держится восстановление.

сходимость | И когда сбои прекращаются, в системе не должно остаться незавершённых записей.

162 000 строк.\*Они следуют правилам?* | Как убедиться, что сто шестьдесят тысяч строк, написанных за десять недель, этим правилам следуют?

меняется\экономика | Когда код пишет модель, меняется экономика разработки.

!

!fig two 0

!fig two 1
1. формальная постановка | Первое требование состоит в том, что задача формулируется формально до начала кодирования.
!fig two 2
2. избыточная проверка | Второе требование состоит в том, что результат проверяется избыточно, и у каждого аспекта качества есть число.
начну со второго | Начну со второго.

= Ничто не ждёт по часам
!
ничто не ждёт\*по часам* | Первое правило проверки гласит, что ничто не ждёт по часам.
!fig clock 1
в коде | В коде работа ждёт события, которое её создаёт.
интервал ошибается в обе стороны | Фиксированный интервал плох в обе стороны. При длинном интервале событие ждёт зря, при коротком кластер постоянно тратит ресурсы на опрос.
!fig clock 2
в тестах | В тестах ни одна проверка не закладывается на таймаут.
тест вызывает событие | Тест вызывает событие, и работа следует за ним.
!
тест, который ждёт интервал,\*измеряет интервал* | Тест, который пережидает интервал, измеряет интервал.
агент «чинит» тест\*увеличением таймаута* | Для агента это особенно важно. Нестабильный тест он чинит увеличением таймаута, и ошибка остаётся в коде.

= Внедрение поведения
!
любой сбой\вызывается\*по имени* | Второе правило требует, чтобы любой сценарий сбоя вызывался из теста по имени.
*160* точек внедрения | В коде S3R сто шестьдесят именованных точек внедрения.
!fig errinj 1
отказ | Точка может отказать, и тогда тест видит, что оставляет после себя оборванная сага.
!fig errinj 2
сон | Точка может уснуть, и тогда тест видит, что происходит между двумя шагами.
!fig errinj 3
удержание | Точку можно удержать и отпустить, и тогда гонка воспроизводится по команде теста.
!fig errinj 0
и в релизной сборке | Эти точки есть и в релизной сборке, потому что механизм, который живёт только в особой сборке, тесты перестают покрывать.
CI требует точку на каждом шве | И CI не пропускает шов саги, у которого нет своей точки внедрения.

случайная\нагрузка | Третье правило это случайная нагрузка.

!fig two 1

*openspec* | Для этого мы используем openspec.
открытый инструмент\и соглашение | Это открытый инструмент и соглашение о том, как записывать изменения.
!fig change 0
четыре файла | Изменение состоит из четырёх файлов: предложение, проект решения, требования и список задач.
!fig change 12

!fig change 3
требование и сценарии | Требование формулирует инвариант, а под ним идут сценарии вида «когда происходит то-то, система обязана сделать то-то».
!pre
### Requirement: A pass frees only positions no commit can still claim
A reconciliation pass SHALL free a position only when no committed row
names it and no row commit arriving later can name it.
!end
требование | Вот требование из нашей истории с опоздавшим подтверждением. Проход освобождает место, только если ни одна фиксация уже не может на него сослаться.
!pre
#### Scenario: A row commit arrives after the pass
- WHEN a writer has written its bytes, its row commit is delayed
  in the network past its own timeout, and a pass then finds no row
  naming the positions and frees them
- THEN the delayed commit, when it reaches the row's master,
  is refused, and no row names the freed positions
!end
сценарий | И сценарий к нему. Фиксация задержалась в сети, проход освободил место, опоздавшая фиксация получает отказ.
!fig change 4
сценарий → тест | Сценарий превращается в тест, и у каждой задачи в списке записано имя теста, который её проверяет.
!fig change 5
архив | Когда изменение реализовано, оно уходит в архив, а его требования переезжают в постоянную спецификацию.

= Следующий шаг
!
*TLA+* | Следующий шаг для нас это TLA+.
слова → модель | Спецификация openspec написана словами, и проверяют её чтением.
все чередования событий\*до кода* | Модель протокола на TLA+ позволяет перебрать все чередования событий ещё до того, как написан код.
было дорого | Раньше это было дорого и поэтому редко, а с моделями написание TLA+ подешевело.
расскажу\через год | Я этого ещё не пробовал, расскажу через год.

= Кто проверяет проверку
!
кто проверяет\*проверку*? | И последнее. Точки внедрения и саму симуляцию тоже нужно проверять.
!fig neuter 1
внести известную ошибку | Мы вносим в код известные ошибки и убеждаемся, что симуляция находит каждую.
!fig neuter 2
выключить проверяемое | Каждый слой тестов проверяется тем, что проверяемый им механизм выключают, и тест обязан упасть.

тест, который\не может упасть,\*ничего не доказывает* | Иначе нет оснований доверять тестам, которые на этих средствах построены.

    if (st === 0) {
      [0, 1, 2, 3].forEach(function (i) { h += A(1125, 225 + i * 100, 480, 220 + i * 78, C.red, 0, 1, 1); });
      h += R(600, 300, 400, 110, '#fff', C.red) + T(800, 345, 'переход между потоками', 26, C.red, 'middle', 700) + T(800, 385, '8 мкс туда и 8 мкс обратно', 24, C.red);
    } else {

      if (st >= 2) {

        h += A(470, 555, 530, 555, C.red) + A(727, 555, 756, 555, C.red) + A(870, 518, 870, 495, C.red) + T(800, 640, 'новый снимок: замена одного указателя', 24, C.red, 'middle', 600);
      }
      if (st >= 3) { [0, 1, 2, 3].forEach(function (i) { h += A(1125, 225 + i * 100, 985, 260 + i * 55, C.teal); }); h += T(1050, 170, 'блокировок нет', 24, C.teal, 'middle', 600); }

    return SVG(h);
  }

  function drawLate(st) {
    var X = [260, 800, 1340], names = ['Писатель', 'Проход сверки', 'Мастер строки'], h = '';
    X.forEach(function (x, i) { h += R(x - 170, 30, 340, 70, C.light, C.black) + T(x, 76, names[i], 30, C.black, 'middle', 700) + '<line x1="' + x + '" y1="100" x2="' + x + '" y2="680" stroke="' + C.gray + '" stroke-width="3" stroke-dasharray="6 8"/>'; });
    h += R(90, 140, 340, 64, C.pink, C.red) + T(260, 181, 'блоки записаны на диски', 24);
    h += A(260, 250, st >= 3 ? 1330 : 640, st >= 3 ? 520 : 335, C.red, st < 3) + T(st >= 3 ? 520 : 470, st >= 3 ? 300 : 270, st >= 3 ? 'фиксация строки' : 'фиксация строки: задержка в сети', 24, C.red, 'middle', 600);
    if (st >= 2) { h += R(630, 360, 340, 64, C.bluel, C.blue) + T(800, 401, 'строки нет: место свободно', 24) + R(630, 436, 340, 64, C.bluel, C.blue) + T(800, 477, 'место выдано другому', 24); }

    if (st === 5) { h += R(630, 290, 340, 60, C.teall, C.teal) + T(800, 329, 'горизонт поднят', 24, C.black, 'middle', 600) + R(1130, 540, 420, 110, C.teall, C.teal) + T(1340, 585, 'отказ', 30, C.black, 'middle', 700) + T(1340, 622, 'метка записи не новее горизонта', 22); }
    return SVG(h);
  }

  function drawPath(st) {
    var bands = [['1. Глобальные метаданные', 'Raft, один журнал на кластер', C.tint, C.red], ['2. Каталог', 'транзакция в одном репликасете', C.bluel, C.blue], ['3. Размещение', 'группа из k + m дисков, карта блоков в строке объекта', C.teall, C.teal], ['4. Данные', 'синхронная запись одного блока', C.orangel, C.orange]], h = '';
    bands.forEach(function (b, i) {
      var y = 30 + i * 165, op = (st === 0 || st === 5 || st === i + 1) ? 1 : 0.22;
      h += '<g opacity="' + op + '">' + R(40, y, 1520, 140, b[2], b[3]) + T(80, y + 60, b[0], 34, C.black, 'start', 700) + T(80, y + 104, b[1], 24, C.gray, 'start');
      if (i === 0) [0, 1, 2].forEach(function (k) { h += R(900 + k * 210, y + 30, 180, 80, '#fff', b[3]) + T(990 + k * 210, y + 66, 'узел ' + (k + 1), 22) + T(990 + k * 210, y + 94, 'та же копия', 18, C.gray); });
      if (i === 1) ['a/', 'b/', 'c/'].forEach(function (d, k) { h += R(900 + k * 210, y + 30, 180, 80, '#fff', b[3]) + T(990 + k * 210, y + 66, 'репликасет ' + (k + 1), 22) + T(990 + k * 210, y + 94, 'директория ' + d, 18, C.gray); });
      if (i === 2) ['D1', 'D2', 'P1', 'P2'].forEach(function (d, k) { h += R(900 + k * 158, y + 35, 130, 70, d[0] === 'P' ? b[3] : '#fff', b[3]) + T(965 + k * 158, y + 80, d, 28, d[0] === 'P' ? '#fff' : C.black, 'middle', 600); });
      if (i === 3) [0, 1, 2, 3].forEach(function (k) { h += R(900 + k * 158, y + 30, 130, 80, '#fff', b[3], 1, 40) + T(965 + k * 158, y + 80, 'диск', 22); });
      h += '</g>';
    });
    if (st === 5) h += A(800, 15, 800, 680, C.red) + R(690, 300, 220, 64, C.red, C.red) + T(800, 342, 'PUT объекта', 26, '#fff', 'middle', 700);
    return SVG(h);
  }

  function drawCluster(m) {
    var cols = [[C.pink, C.red, 'a/'], [C.orangel, C.orange, 'b/'], [C.teall, C.teal, 'c/']], h = '';
    cols.forEach(function (c, i) {
      var x = 60 + i * 510;
      h += R(x, 40, 460, 620, '#fff', C.black) + T(x + 230, 90, 'узел ' + (i + 1), 30, C.black, 'middle', 700);
      h += '<g opacity="' + (m === 's' ? 0.25 : 1) + '">' + R(x + 30, 120, 400, 210, C.light, C.gray) + T(x + 230, 165, 'глобальные таблицы', 26, C.black, 'middle', 700) + T(x + 230, 210, 'арендаторы, ключи', 22) + T(x + 230, 244, 'бакеты, политики, CORS', 22) + T(x + 230, 278, 'диски, группы', 22) + T(x + 230, 312, 'одинаковая копия', 20, C.gray) + '</g>';
      h += '<g opacity="' + (m === 'g' ? 0.25 : 1) + '">' + R(x + 30, 360, 400, 270, c[0], c[1]) + T(x + 230, 405, 'шардированные таблицы', 26, C.black, 'middle', 700) + T(x + 230, 455, 'объекты директории ' + c[2], 22) + T(x + 230, 489, 'её версии и загрузки', 22) + T(x + 230, 523, 'её очередь удаления', 22) + T(x + 230, 590, 'свой набор строк', 20, C.gray) + '</g>';
    });
    if (m === 'g') h += A(170, 20, 1430, 20, C.red, 1, 1, 1) + T(800, 14, '', 1);
    return SVG(h);
  }
  var cur = 0;
  var elScript = document.getElementById('script'), elShow = document.getElementById('show');
  var mode = 'script';

  function renderScript() {
    var h = '<h1>S3R и openspec: текст доклада</h1>' +
      '<div class="meta"><b>' + items.length + '</b> предложений, около <b>' + mmss(items.length * SEC) +
      '</b> при 12,5 с на предложение. Слева то, что на экране, справа то, что произносится.</div>' +
      '<div class="bar"><button class="primary" id="go">Показ с начала</button>' +
      '<span class="meta" style="margin:0">Щелчок по строке начинает показ с неё. В показе: стрелки или пробел листают, F полный экран, N прячет текст, Esc возвращает сюда.</span></div>';
    var lp = null, lg = null, gcount = {};
    items.forEach(function (it) { var k = it.part + '|' + it.group; gcount[k] = (gcount[k] || 0) + 1; });
    items.forEach(function (it, i) {
      if (it.part !== lp) { h += '<h2>' + esc(it.part) + '</h2>'; lp = it.part; lg = null; }
      if (it.group !== lg) {
        var c = gcount[it.part + '|' + it.group];
        h += '<h3>' + esc(it.group) + '<small>' + c + ' предл., ' + mmss(c * SEC) + ', с ' + mmss(i * SEC) + '</small></h3>'; lg = it.group;
      }
      var scr = it.scr === '-' ? '' : plain(it.scr);
      var tag = it.ill ? (it.ill.kind === 'fig' ? '▦ схема' : it.ill.kind === 'pre' ? '▤ текст' : '▣ ' + it.ill.v.split('/').pop().replace(/\.\w+$/, '')) : '';
      h += '<div class="row" data-i="' + i + '"><div class="n">' + (i + 1) + '</div><div class="scr">' + esc(scr) +
        (tag ? '<div style="font-weight:400;color:#737A82;font-size:12px">' + esc(tag) + '</div>' : '') +
        '</div><div class="say">' + esc(it.say) + '</div></div>';
    });
    elScript.innerHTML = h;
    document.getElementById('go').onclick = function () { start(0); };
    Array.prototype.forEach.call(elScript.querySelectorAll('.row'), function (r) {
      r.onclick = function () { start(+r.getAttribute('data-i')); };
    });
  }

  function size(s) {
    var lines = s.replace(/[`*]/g, '').split('\\'), longest = 0;
    lines.forEach(function (l) { longest = Math.max(longest, l.length); });
    var byW = 150 / Math.max(longest, 4), byH = 58 / lines.length;
    return Math.max(4, Math.min(byW, byH, 30));
  }

  function renderShow() {
    var it = items[cur], il = it.ill;
    elShow.querySelector('.part').textContent = it.part;
    elShow.querySelector('.group').textContent = it.group;
    var p = elShow.querySelector('.phrase'), box = elShow.querySelector('.ill');
    p.innerHTML = it.scr === '-' ? '' : fmt(il && il.kind !== 'side' ? it.scr.replace(/\\/g, ' ') : it.scr);
    p.style.fontSize = 'min(' + size(it.scr) + 'vw, ' + (size(it.scr) * 1.7) + 'vh)';
    elShow.classList.toggle('has-ill', !!il);
    elShow.classList.toggle('side', !!il && il.kind === 'side');
    elShow.classList.toggle('full', !!il && il.kind === 'full');
    if (!il) box.innerHTML = '';
    else if (il.kind === 'fig') box.innerHTML = fig(il.v, il.arg);
    else if (il.kind === 'pre') box.innerHTML = '<div class="pre">' + esc(il.v) + '</div>';
    else box.innerHTML = '<img src="' + il.v + '" alt="">';
    elShow.querySelector('.say').textContent = it.say;
    elShow.querySelector('.count').textContent = (cur + 1) + ' / ' + items.length;
    elShow.querySelector('.progress').style.width = ((cur + 1) / items.length * 100) + '%';
    var nx = items[cur + 1];
    if (nx && nx.ill && nx.ill.v && nx.ill.kind !== 'fig') { var im = new Image(); im.src = nx.ill.v; }
  }

  function go(i) {
    cur = Math.max(0, Math.min(items.length - 1, i));
    renderShow();
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }
  function start(i) { mode = 'show'; elScript.style.display = 'none'; elShow.style.display = 'block'; go(i); }
  function stop() {
    mode = 'script'; elShow.style.display = 'none'; elScript.style.display = 'block';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    var r = elScript.querySelector('.row[data-i="' + cur + '"]'); if (r) r.scrollIntoView({ block: 'center' });
  }

  document.addEventListener('keydown', function (e) {
    if (mode === 'script') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'ArrowDown' || e.key === 'Enter') { go(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Backspace') { go(cur - 1); e.preventDefault(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(items.length - 1);
    else if (e.key === 'n' || e.key === 'т') elShow.classList.toggle('no-say');
    else if (e.key === 'f' || e.key === 'а') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
    else if (e.key === 'Escape') stop();
  });
  elShow.addEventListener('click', function (e) { go(cur + (e.clientX < window.innerWidth * 0.25 ? -1 : 1)); });

  renderScript();
  var m = /^#(\d+)$/.exec(location.hash);
  if (m) start(+m[1] - 1);
})();
</script>
