# Часть I. Picodata

= Приложение рядом с данными
!full /assets/img/talks/s3r/alfa-06.jpg
- | Обычно приложение и база данных работают в разных процессах и общаются по сети.
- | Каждое обращение к данным в такой схеме стоит миллисекунды.
- | Если код работает в одном процессе с данными, то же обращение превращается в поиск по индексу в памяти и стоит порядка микросекунды.
!
*×1000* | Разница в тысячу раз даёт другой класс приложений.
!fig colo
транзакция в процессе СУБД | Границы транзакции в этом случае задаёт код, который работает рядом с данными.
Rust внутри Tarantool | Вам этот подход знаком, так работает ваш тарифный калькулятор, написанный на Rust внутри Tarantool.

= От узла к кластеру
!
один узел → *кластер* | Вопрос в том, что нужно добавить, чтобы один узел с модулем на Rust стал кластером.
!full /assets/img/talks/s3r/alfa-32.jpg
- | Во-первых, схема данных в Picodata одна на весь кластер, и меняет её распределённый DDL.
!img /assets/img/talks/buckets.svg
шардирование | Во-вторых, шардирование выполняет само ядро: данные переезжают между узлами, а кластер продолжает работать.
!img /assets/img/talks/architecture.svg
Raft | В-третьих, за состав кластера и отказы узлов отвечает Raft в ядре, внешний координатор не нужен.
!img /assets/img/talks/sql_cloud.svg
Распределённый SQL | В-четвёртых, к тем же данным можно обратиться распределённым SQL по протоколу PostgreSQL.
!full /assets/img/talks/s3r/alfa-37.jpg
- | И наконец, сам код приложения становится плагином с манифестом, миграциями и версией.
!img /assets/img/talks/plugin_lifecycle.svg
`ALTER PLUGIN` | Плагин устанавливает и обновляет команда SQL, и две его версии могут работать в кластере одновременно.
!
Rust crate:\git, cargo, CI | При этом плагин остаётся обычным крейтом Rust с исходниками в git, сборкой через cargo, тестами и CI.

= Два вида таблиц
!fig tables all
два вида таблиц | Для производительности важнее всего различие между двумя видами таблиц, и сегодня я остановлюсь на нём подробнее.
!full /assets/img/talks/s3r/alfa-31.jpg
- | Глобальная таблица лежит на каждом узле кластера полностью.
!fig cluster g
запись через *Raft* | Запись в неё идёт через журнал Raft, через одного лидера на весь кластер.
*локальное* чтение | Зато читать её можно на любом узле, и это чтение из локальной памяти.
!full /assets/img/talks/s3r/alfa-30.jpg
- | В шардированной таблице каждая строка живёт на одном репликасете.
!fig cluster s
запись: *горизонтальное масштабирование* | Запись попадает сразу в тот репликасет, который владеет ключом, и пропускная способность растёт с числом узлов.
!fig cluster all
Справочные и основные данные | Глобальные таблицы подходят для справочников и конфигурации, шардированные для основного объёма данных.

= Управление распределением
!fig cluster s
Выбор ключа распределения | Ключ, по которому Picodata шардирует таблицу, выбирает разработчик, и он не обязан совпадать с первичным ключом.
одинаковый ключ распределения ⇒ один репликасет | Строки с одинаковым ключом распределения лежат на одном репликасете, даже если это строки разных таблиц.
совместное распределение (co-location) | Мы называем это совместным распределением.
!
граница транзакции =\*один* репликасет | Транзакция в Picodata работает в пределах одного репликасета.
атомарность ⇒\*co-location* | Поэтому всё, что должно меняться атомарно, получает один ключ распределения.
производительность ⇒\*запрос с ключом* | Запрос с известным ключом идёт на один узел, а запрос, в котором ключа нет, обходит весь кластер.
ключ определяет\*атомарность*\и *производительность* | Выбор ключа распределения определяет и атомарность операций, и производительность запросов.

# Часть II. S3 как задача

= Зачем ещё одно хранилище
!side /assets/img/talks/s3r/datacenter-ring.webp
Lakehouse | Объектное хранилище сегодня это основа Lakehouse и задач искусственного интеллекта.
!full /assets/img/talks/s3r/s3r-04.jpg
- | Диски с этой нагрузкой справляются, предел задаёт слой метаданных.
- | В классических хранилищах сервис метаданных один, листинг опрашивает все наборы дисков, а чтение мелкого файла стоит столько же, сколько чтение большого.

= Идея S3R
!full /assets/img/talks/s3r/s3r-05.jpg
- | В S3R метаданные хранит распределённая СУБД, а содержимое объектов хранят локальные диски.
- | Плагин работает внутри процесса Picodata, поэтому рядом нет ни отдельного кластера метаданных, ни встроенной базы ключей.
- | Содержимое защищают коды Рида-Соломона. S3R режет объект на полосы и кодирует каждую в блоки данных и блоки чётности.
!full /assets/img/talks/s3r/s3r-06.jpg
- | Из такой архитектуры следуют три свойства. Первое это согласованность, успешная запись видна следующему чтению.
- | Второе и третье: пропускная способность по метаданным растёт с числом узлов, а объект до четырёх килобайт S3R читает из памяти.

= Что должно уметь S3
!
S3 как *задача* | Теперь о том, что такое S3 как задача.
только PUT/GET? | «Положить файл и взять файл» составляют малую часть протокола.
!full /assets/img/talks/s3r/s3r-13.jpg
- | Это версионирование, блокировка объектов, условная запись, multipart upload, жизненный цикл, политики и CORS.
- | Совместимость мы измеряем набором тестов ceph s3-tests, и S3R проходит все четыреста шестнадцать выбранных сценариев.
!full /assets/img/talks/s3r/s3r-15.jpg
- | Отдельная большая тема это мультитенантность. У тенанта свой домен, свой сертификат, свои ключи и свои квоты.
!fig checks
на каждом запросе | На каждом запросе хранилище обязано проверить подпись, тенанта, бакет, права, квоту и правила CORS.
*6* проверок метаданных на запрос | Это шесть проверок до того, как началась сама работа, и все они обращаются к метаданным.
!
как обеспечить\*производительность*? | Высокую производительность при таком числе проверок даёт правильная раскладка данных по кластеру.

= Что куда положить
!fig cluster g
глобальные таблицы | В глобальные таблицы мы кладём всё, что запросы читают постоянно, а меняют редко.
!fig layout g1
Учётные данные тенантов | Это тенанты и их ключи доступа.
!fig layout g2
бакеты: policy, ACL, CORS, lifecycle | Это бакеты вместе со своими документами: политикой, списком доступа, правилами CORS и жизненного цикла.
!fig layout g3
топология хранилища | Это карта хранилища: ярусы, диски и группы размещения.
!fig layout g
10³–10⁵ строк на каждом узле | Таких строк тысячи, в худшем случае сотни тысяч, и каждый узел держит их все.
!fig cluster s
шардированные таблицы | В шардированные таблицы мы кладём то, чего много: объекты, версии и директории.
10⁹ строк | Таких строк миллиарды, и запись в них идёт на каждом PUT.
!fig layout s
глобальное размещение ✗ | Сделать их глобальными нельзя. Любая запись пошла бы через одного лидера Raft, а весь каталог пришлось бы держать в памяти каждого узла.
!fig layout t
изоляция тенантов: отдельные таблицы | У каждого тенанта свои таблицы, поэтому запрос одного тенанта физически не может назвать таблицу другого.

= Ключ распределения каталога
!
по какому ключу\шардировать *объекты*? | Теперь главный вопрос: по какому ключу шардировать объекты.
!fig key 1
`(bucket, key)` | Если шардировать по бакету и полному ключу объекта, листинг директории превращается в обход всего кластера.
!fig key 2
`(bucket, parent)` | Если шардировать по бакету и родительской директории, листинг становится одним проходом по индексу, но бакет, в котором нет директорий, попадает на один узел весь.
!fig key 3
`(bucket, parent, frag)` | Мы добавили в ключ третье поле, номер фрагмента, и вычисляем его из имени объекта.
`frag_bits` в глобальной строке бакета | Число фрагментов задаёт владелец бакета, и лежит оно в глобальной строке бакета, поэтому узнать его при маршрутизации ничего не стоит.
!full /assets/img/talks/s3r/s3r-14.jpg
- | В результате стоимость страницы листинга не растёт с размером директории. Тысячу ключей S3R читает за две с половиной миллисекунды.

= Совместное распределение для атомарности операций
!
какие операции\*атомарны*? | Второй вопрос к ключу: какие операции станут атомарными.
!fig del
удаление объекта | При удалении объекта нужно убрать строку из каталога и освободить место на дисках.
два репликасета ⇒ две транзакции 💥 | Если намерение освободить место лежит на другом узле, сбой между двумя записями оставит блоки, на которые никто не ссылается.
очередь удаления: co-location с объектом ✓ | Поэтому мы распределяем очередь удаления по ключу объекта, и намерение попадает в ту же транзакцию, что убирает строку.
*одна* транзакция | Сбой между этими двумя шагами невозможен, потому что шаг один.
!
co-location\это pre-requisite\для *корректности* | Совместное распределение для нас необходимое условие корректности.

= Applied global state
!
стоимость чтения\глобальных таблиц | Остаётся вопрос о производительности чтения глобальных таблиц.
данные в памяти\каждого узла | Они ведь и так лежат в памяти каждого узла.
!fig ags 0
Tokio thread pool ⇄ TX thread | Но запросы S3 обрабатывает пул потоков Tokio, а таблицы принадлежат одному транзакционному потоку.
чтение строки: 0,13 мкс | Само чтение строки стоит десятую долю микросекунды.
переключение потоков: 8 мкс в каждую сторону | А переход из потока обработчика в транзакционный стоит около восьми микросекунд в каждую сторону.
несколько переключений на запрос | И таких переходов на каждом запросе несколько.
!
*applied\global\state* | Наше решение мы назвали applied global state.
!fig ags 1
immutable snapshot | Все решения Raft каждый узел держит в памяти одним неизменяемым снимком.
!fig ags 2
триггер → builder → замена указателя | Триггер на фиксацию транзакции запоминает изменённые строки, builder разбирает их и публикует новый снимок заменой одного указателя.
!fig ags 3
lock-free чтение | Обработчик запроса берёт снимок один раз и читает его обычными обращениями к памяти. Блокировок нет.
!
предвычисленные\структуры | Данные в снимке лежат в форме вопроса. Список доступа, например, builder заранее компилирует в битовую маску.
`granted & wanted != 0` | Проверка прав превращается в одну побитовую операцию.
консистентность\по границам\транзакций | Снимок соблюдает границы транзакций, поэтому наполовину переименованный бакет увидеть нельзя.

= Цифры
!full /assets/img/talks/s3r/s3r-20.jpg
- | Теперь пара цифр. Мы сравнили S3R и MinIO на одном ядре с каждой стороны, обе делают fsync до подтверждения.

- | Запись маленького объекта быстрее на два порядка, потому что мы платим одним пакетным обращением к журналу.

метаданные:\*×3 … ×6* | Операции с метаданными в разы быстрее при равных ресурсах, и причина в раскладке данных.

# Часть III. Корректность

= Четыре атомарных среза
!
*корректность* | До сих пор всё выглядело хорошо, теперь о том, что в этой задаче трудно.
!fig slices 0
четыре среза состояния | У S3R четыре среза состояния, и у каждого лишь локальная гарантия атомарности.
!fig slices 1
1. глобальные метаданные | Первый срез это глобальные метаданные, и их атомарность обеспечивает Raft.
!fig slices 2
2. каталог | Второй срез это каталог, строки объектов и директорий. Здесь атомарна транзакция в одном репликасете.
!fig slices 3
3. размещение | Третий срез это размещение. Оно говорит, какие блоки какой полосы лежат на каких дисках.
!fig slices 4
4. данные | Четвёртый срез это сами байты на дисках, и здесь атомарна только синхронная запись одного блока.
!fig slices 0
ни одна транзакция не охватывает два среза | Ни одна транзакция не покрывает два среза сразу.
!fig slices 5
запись объекта проходит через все четыре | А запись одного объекта проходит через все четыре.

= Объект как сага
!fig saga 0
сага из трёх шагов | Поэтому запись объекта у нас это сага из трёх шагов.
!fig saga 1
1. блоки | Сначала S3R записывает блоки на диски.
!fig saga 2
2. директории | Затем создаёт строки родительских директорий, и лежат они, возможно, на других узлах.
!fig saga 3
3. строка объекта | И в конце фиксирует строку объекта вместе с картой его блоков.
commit point | Строка объекта это точка невозврата. До неё объекта нет, начиная с неё он есть.
!fig saga 0
после сбоя: только недостижимые блоки | Мы выбрали такой порядок, чтобы после сбоя на любом шаге оставался только мусор, который можно найти и убрать.
!
каждый *префикс* саги —\допустимое состояние | Сага корректна тогда, когда каждый её префикс является допустимым состоянием.
утечка места (leak) ✓\висячая ссылка (dangling reference) 💥 | Ошибка допустима только в одну сторону. Утечка места задерживает его повторное использование, а висячая ссылка недопустима.

= Сбой в любой точке
!fig saga x1
crash между шагами | Теперь представим, что процесс останавливается между любыми двумя шагами.
кто освобождает блоки? | S3R записал данные, но не зафиксировал строку. Кто освободит место?
!fig late 1
фиксация задержана в сети | Другой случай. Подтверждение записи задержалось в сети дольше своего таймаута.
!fig late 2
сверка освободила блоки | Фоновый проход за это время не нашёл строки и освободил место.
!fig late 3
фиксация доставлена | А потом подтверждение дошло.
!fig late 4
use-after-free 💥 | Если его принять, строка объекта будет ссылаться на место, где уже лежат чужие данные.
!fig late 5
fencing: горизонт сверки ✓ | Теперь проход перед освобождением поднимает горизонт, и мастер строки отказывает любой фиксации старше этого горизонта.
!
happy path тесты ✗ | Тесты основного сценария, happy path, таких ошибок не находят.

= Правила восстановления
!fig rules 0
правила | Из таких случаев выросли правила, на которых держится восстановление.
!fig rules 1
Паузы и интервалы ожидания запрещены | Корректность не опирается на таймеры и периодические обходы.
!fig rules 2
Состояние отменяет его создатель | Состояние отменяет тот, кто его создал, и ведёт его повтор от устойчивой записи.
!fig rules 3
исход хранится в устойчивой записи | Исход операции не живёт в сообщении, которое можно потерять.
!fig rules 4
идемпотентность | Любая операция, применённая дважды, даёт тот же результат, что и применённая один раз.
!fig rules 5
сходимость (convergence) | И когда сбои прекращаются, в системе не должно остаться незавершённых записей.
!
как это\*проверить*? | Как убедиться, что код этим правилам следует?

# Часть IV. Метод

= Узкое место это проверка
!side /assets/img/talks/s3r/folder-search.webp
экономика\разработки | Когда код пишет модель, меняется экономика разработки.
генерация\быстрее ревью | Модель пишет код быстрее, чем человек успевает его прочитать.
нет неявного\контекста | У модели нет неявного знания о проекте. Она делает то, что ей написали, и то, что можно проверить.
!
ошибка выглядит как\*правдоподобный код* | А ошибка в распределённом алгоритме выглядит как правдоподобный код.
!fig two 0
два требования | Отсюда два требования, и оба с моделями кратно важнее, чем при разработке человеком.
!fig two 1
1. формальная постановка | Первое требование состоит в том, что задачу мы ставим формально до начала кодирования.
!fig two 2
2. избыточная проверка | Второе требование состоит в том, что результат мы проверяем избыточно, и у каждого аспекта качества есть число.
порядок изложения:\2, затем 1 | Начну со второго.

= Ничто не ждёт по часам
!
ожиданий\по *wall clock*\нет | Первое правило проверки гласит, что ничто не ждёт по часам.
!fig clock 1
в коде | В коде работа ждёт события, которое её создаёт.
интервал: задержка или лишний опрос | Фиксированный интервал плох в обе стороны. При длинном интервале событие ждёт зря, при коротком кластер постоянно тратит ресурсы на опрос.
!fig clock 2
в тестах | В тестах ни одна проверка не закладывается на таймаут.
тест вызывает событие | Тест вызывает событие, и работа следует за ним.
!
тест, который ждёт интервал,\*измеряет интервал* | Тест, который пережидает интервал, измеряет интервал.
агент «чинит» тест\*увеличением таймаута* | Для агента это особенно важно. Нестабильный тест он чинит увеличением таймаута, и ошибка остаётся в коде.

= Fault injection
!
fault injection:\любой сбой\*по имени* | Второе правило требует, чтобы тест мог вызвать любой сценарий сбоя по имени.
*160* точек инъекции | В коде S3R сто шестьдесят именованных точек инъекции.
!fig errinj 1
отказ (fail) | Точка может отказать, и тогда тест видит, что оставляет после себя оборванная сага.
!fig errinj 2
задержка (sleep) | Точка может уснуть, и тогда тест видит, что происходит между двумя шагами.
!fig errinj 3
удержание (hold) | Точку можно удержать и отпустить, и тогда тест воспроизводит гонку по своей команде.
!fig errinj 0
в релизной сборке ✓ | Эти точки есть и в релизной сборке, потому что механизм, который живёт только в особой сборке, тесты перестают покрывать.
CI требует точку на каждой границе шагов | И CI не пропускает границу между шагами саги, у которой нет своей точки инъекции.

= Симуляционное тестирование
!
рандомизированное\тестирование | Третье правило это случайная нагрузка.
!fig sim 1
5000 операций в секунду | Симуляция каталога запускает произвольную смесь операций S3, около пяти тысяч в секунду.
!fig sim 2
сбои в непредсказуемые моменты | Одновременно она в непредсказуемые моменты включает точки инъекции, чаще всего сразу за устойчивым шагом.
!fig sim 3
изменения топологии | Параллельно переезжают данные между узлами, меняются лидеры, отказывает диск, кластер перезапускается полностью.
!fig sim 4
проверка инвариантов | В конце сбои прекращаются, и симуляция проверяет инварианты.
durability ✓  удалённое не возвращается ✓ | Ни один подтверждённый объект не потерян, ни один удалённый не появился снова, содержимое совпадает по контрольной сумме.
!
существует = виден = читается | «Существует», «виден в листинге» и «читается» должны быть одним фактом, сказанным тремя способами.
0 отказов ⇒\прогон *не засчитан* | Прогон, в котором ни одна операция не получила отказ, считается проваленным, потому что он ничего не доказывает о сбоях.
!side /assets/img/talks/s3r/datacenter-ring-02.webp
seed\⇒\воспроизведение | Вторая симуляция, для групп размещения, полностью детерминирована. Настоящий код работает в модельной сети, и значение seed воспроизводит сбой.

= Что нашло симуляционное тестирование
!
найденные\*дефекты* | Теперь о том, что симуляция нашла.
!fig found 1
seed 2 | На втором же значении seed появился объект, который существует, виден в листинге и не читается.
!fig found 2
−500 объектов | Один прогон терял около пятисот объектов, потому что S3R выдавал место до того, как его заголовок попадал на диск.
!fig found 3
дедупликация | Дедупликация теряла данные тремя разными способами.
!
границы шагов саг:\14 → *33* из 36 | Границ между шагами саг в коде тридцать шесть. Первый прогон, в котором мы их считали, достигал четырнадцати, сейчас тридцати трёх.
code review ✗ | Ни одну из этих ошибок я бы не нашёл чтением кода.

= Число для каждого аспекта качества
!
*метрика*\для каждого аспекта качества | Четвёртое правило требует числа для каждого аспекта качества.
!fig metrics 1
совместимость | Совместимость мы измеряем числом пройденных сценариев, и S3R проходит все четыреста шестнадцать.
!fig metrics 2
покрытие | У покрытия есть порог на каждый файл, и понизить его можно только с письменным объяснением.
!fig metrics 3
покрытие сбоев | Покрытие сбоев мы измеряем достигнутыми границами шагов, их тридцать три из тридцати шести.

стоимость при 10⁹ объектов | Шаг, который обходит все объекты, обязан назвать свою стоимость при миллиарде записей.

ядро Picodata | Тот же приём мы применяем в ядре Picodata. Для любого запроса SQL можно получить число опкодов VDBE, число инструкций процессора и число прочитанных строк.
оптимизация запросов: измеримо | Тесты фиксируют эти числа, и качество оптимизации запросов перестаёт быть мнением.

нет числа →\*незаметная деградация* | Модель оптимизирует то, что мы измеряем, а свойство, у которого нет числа, деградирует незаметно.

= openspec
!fig two 1
формальная постановка до кода | Теперь о первом требовании, о формальной постановке до кода.
!
симуляция проверяет\только заданные\инварианты | Симуляция проверяет только те инварианты, которые в неё заложили.
кто ведёт\инварианты? | Кто-то должен проследить, что мы вообще сформулировали инвариант и что следующее изменение его не отменило.
*openspec* | Для этого мы используем openspec.
open source\инструмент | Это открытый инструмент и соглашение о том, как записывать изменения.
!fig change 0
четыре файла | Изменение состоит из четырёх файлов: предложение, проект решения, требования и список задач.
!fig change 12
Обоснование решений | Предложение отвечает на вопрос «зачем», проект решения перечисляет выбранные варианты и отвергнутые альтернативы.
!fig change 3
Требования со сценариями | Требование формулирует инвариант, а под ним идут сценарии вида «когда происходит то-то, система обязана сделать то-то».
!pre
### Requirement: A pass frees only positions no commit can still claim
A reconciliation pass SHALL free a position only when no committed row
names it and no row commit arriving later can name it.
!end
требование | Вот требование из нашей истории с опоздавшим подтверждением. Проход освобождает место, только если ни одна фиксация уже не может на него сослаться.
!pre
#### Scenario: A row commit arrives after the pass
- WHEN a writer has written its bytes, its row commit is delayed
  in the network past its own timeout, and a pass then finds no row
  naming the positions and frees them
- THEN the delayed commit, when it reaches the row's master,
  is refused, and no row names the freed positions
!end
сценарий | И сценарий к нему. Фиксация задержалась в сети, проход освободил место, опоздавшая фиксация получает отказ.
!fig change 4
сценарий → тест | Сценарий превращается в тест, и каждая задача в списке называет его имя.
!fig change 5
архив | Готовое изменение уходит в архив, а его требования переезжают в постоянную спецификацию.

наше\дополнение | К этому мы добавили одно своё правило.

= Следующий шаг
!
*TLA+* | Следующий шаг для нас это TLA+.

    X.forEach(function (x, i) { h += R(x - 170, 30, 340, 70, C.light, C.black) + T(x, 76, names[i], 30, C.black, 'middle', 700) + '<line x1="' + x + '" y1="100" x2="' + x + '" y2="680" stroke="' + C.gray + '" stroke-width="3" stroke-dasharray="6 8"/>'; });
    h += R(70, 140, 380, 64, C.pink, C.red) + T(260, 181, 'блоки записаны на диски', 24);
    h += A(260, 250, st >= 3 ? 1330 : 640, st >= 3 ? 520 : 335, C.red, st < 3) + T(st >= 3 ? 560 : 520, st >= 3 ? 262 : 252, st >= 3 ? 'фиксация строки' : 'фиксация строки, задержка в сети', 24, C.red, 'middle', 600);
    if (st >= 2) { h += R(580, 360, 440, 64, C.bluel, C.blue) + T(800, 401, 'строки нет, место свободно', 24) + R(580, 436, 440, 64, C.bluel, C.blue) + T(800, 477, 'место выдано другому', 24); }
    if (st === 3) h += T(1340, 570, 'дошла', 26, C.red, 'middle', 700);

    if (st === 5) { h += R(1060, 300, 300, 60, C.teall, C.teal) + T(1210, 339, 'горизонт поднят', 24, C.black, 'middle', 600) + R(1100, 540, 480, 110, C.teall, C.teal) + T(1340, 585, 'отказ', 30, C.black, 'middle', 700) + T(1340, 622, 'метка записи не новее горизонта', 22); }

  function drawPath(st) {
    var bands = [['1. Глобальные метаданные', 'Raft, один журнал на кластер', C.tint, C.red], ['2. Каталог', 'транзакция в одном репликасете', C.bluel, C.blue], ['3. Размещение', 'группа из k + m дисков, карта блоков в строке объекта', C.teall, C.teal], ['4. Данные', 'синхронная запись одного блока', C.orangel, C.orange]], h = '';
    bands.forEach(function (b, i) {
      var y = 30 + i * 165, op = (st === 0 || st === 5 || st === i + 1) ? 1 : 0.22;
      h += '<g opacity="' + op + '">' + R(40, y, 1520, 140, b[2], b[3]) + T(80, y + 60, b[0], 34, C.black, 'start', 700) + T(80, y + 104, b[1], 24, C.gray, 'start');
      if (i === 0) [0, 1, 2].forEach(function (k) { h += R(900 + k * 210, y + 30, 180, 80, '#fff', b[3]) + T(990 + k * 210, y + 66, 'узел ' + (k + 1), 22) + T(990 + k * 210, y + 94, 'та же копия', 18, C.gray); });
      if (i === 1) ['a/', 'b/', 'c/'].forEach(function (d, k) { h += R(900 + k * 210, y + 30, 180, 80, '#fff', b[3]) + T(990 + k * 210, y + 66, 'репликасет ' + (k + 1), 22) + T(990 + k * 210, y + 94, 'директория ' + d, 18, C.gray); });
      if (i === 2) ['D1', 'D2', 'P1', 'P2'].forEach(function (d, k) { h += R(900 + k * 158, y + 35, 130, 70, d[0] === 'P' ? b[3] : '#fff', b[3]) + T(965 + k * 158, y + 80, d, 28, d[0] === 'P' ? '#fff' : C.black, 'middle', 600); });
      if (i === 3) [0, 1, 2, 3].forEach(function (k) { h += R(900 + k * 158, y + 30, 130, 80, '#fff', b[3], 1, 40) + T(965 + k * 158, y + 80, 'диск', 22); });
      h += '</g>';
    });
    if (st === 5) h += A(800, 15, 800, 680, C.red) + R(690, 300, 220, 64, C.red, C.red) + T(800, 342, 'PUT объекта', 26, '#fff', 'middle', 700);
    return SVG(h);
  }


  function drawColo() {
    var h = '';
    h += T(380, 70, 'Клиент и сервер', 34, C.gray, 'middle', 700);
    h += R(60, 250, 280, 150, C.light, C.black) + T(200, 315, 'Сервер', 28, C.black, 'middle', 600) + T(200, 352, 'приложений', 28, C.black, 'middle', 600);
    h += R(480, 250, 240, 150, C.light, C.black) + T(600, 335, 'СУБД', 30, C.black, 'middle', 600);
    h += A(345, 325, 475, 325, C.gray, 0, 1, 1) + T(410, 300, 'сеть', 24, C.gray);
    h += T(380, 480, 'обращение к данным: ~1 мс', 30, C.black, 'middle', 600);
    h += '<line x1="800" y1="60" x2="800" y2="640" stroke="' + C.light + '" stroke-width="4"/>';
    h += T(1200, 70, 'Плагин в процессе СУБД', 34, C.red, 'middle', 700);

    h += R(960, 250, 480, 90, C.red, C.red) + T(1200, 306, 'плагин на Rust', 30, '#fff', 'middle', 700);
    h += R(960, 360, 480, 80, '#fff', C.red) + T(1200, 410, 'данные в памяти', 28);
    h += T(1200, 540, 'обращение к данным: ~1 мкс', 30, C.red, 'middle', 700);

  }
  function drawCluster(m) {
    var cols = [[C.pink, C.red, 'a/'], [C.orangel, C.orange, 'b/'], [C.teall, C.teal, 'c/']], h = '';
    cols.forEach(function (c, i) {
      var x = 60 + i * 510;
      h += R(x, 40, 460, 620, '#fff', C.black) + T(x + 230, 90, 'узел ' + (i + 1), 30, C.black, 'middle', 700);
      h += '<g opacity="' + (m === 's' ? 0.25 : 1) + '">' + R(x + 30, 120, 400, 210, C.light, C.gray) + T(x + 230, 165, 'глобальные таблицы', 26, C.black, 'middle', 700) + T(x + 230, 210, 'тенанты, ключи', 22) + T(x + 230, 244, 'бакеты, политики, CORS', 22) + T(x + 230, 278, 'диски, группы', 22) + T(x + 230, 312, 'одинаковая копия', 20, C.gray) + '</g>';
      h += '<g opacity="' + (m === 'g' ? 0.25 : 1) + '">' + R(x + 30, 360, 400, 270, c[0], c[1]) + T(x + 230, 405, 'шардированные таблицы', 26, C.black, 'middle', 700) + T(x + 230, 455, 'объекты директории ' + c[2], 22) + T(x + 230, 489, 'её версии и загрузки', 22) + T(x + 230, 523, 'её очередь удаления', 22) + T(x + 230, 590, 'свой набор строк', 20, C.gray) + '</g>';
    });
    if (m === 'g') h += A(170, 20, 1430, 20, C.red, 1, 1, 1) + T(800, 14, '', 1);
    return SVG(h);
  }
  var cur = 0;
  var elScript = document.getElementById('script'), elShow = document.getElementById('show');
  var mode = 'script';

  function renderScript() {
    var h = '<h1>S3R и openspec: текст доклада</h1>' +
      '<div class="meta"><b>' + items.length + '</b> предложений, около <b>' + mmss(items.length * SEC) +
      '</b> при 12,5 с на предложение. Слева то, что на экране, справа то, что произносится.</div>' +
      '<div class="bar"><button class="primary" id="go">Показ с начала</button>' +
      '<span class="meta" style="margin:0">Щелчок по строке начинает показ с неё. В показе: стрелки или пробел листают, F полный экран, N прячет текст, Esc возвращает сюда.</span></div>';
    var lp = null, lg = null, gcount = {};
    items.forEach(function (it) { var k = it.part + '|' + it.group; gcount[k] = (gcount[k] || 0) + 1; });
    items.forEach(function (it, i) {
      if (it.part !== lp) { h += '<h2>' + esc(it.part) + '</h2>'; lp = it.part; lg = null; }
      if (it.group !== lg) {
        var c = gcount[it.part + '|' + it.group];
        h += '<h3>' + esc(it.group) + '<small>' + c + ' предл., ' + mmss(c * SEC) + ', с ' + mmss(i * SEC) + '</small></h3>'; lg = it.group;
      }
      var scr = it.scr === '-' ? '' : plain(it.scr).replace(/^[a-zа-яё]/, function (c) { return c.toUpperCase(); });
      var tag = it.ill ? (it.ill.kind === 'fig' ? '▦ схема' : it.ill.kind === 'pre' ? '▤ текст' : '▣ ' + it.ill.v.split('/').pop().replace(/\.\w+$/, '')) : '';
      h += '<div class="row" data-i="' + i + '"><div class="n">' + (i + 1) + '</div><div class="scr">' + esc(scr) +
        (tag ? '<div style="font-weight:400;color:#737A82;font-size:12px">' + esc(tag) + '</div>' : '') +
        '</div><div class="say">' + esc(it.say) + '</div></div>';
    });
    elScript.innerHTML = h;
    document.getElementById('go').onclick = function () { start(0); };
    Array.prototype.forEach.call(elScript.querySelectorAll('.row'), function (r) {
      r.onclick = function () { start(+r.getAttribute('data-i')); };
    });
  }

  function size(s) {
    var lines = s.replace(/[`*]/g, '').split('\\'), longest = 0;
    lines.forEach(function (l) { longest = Math.max(longest, l.length); });
    var byW = 150 / Math.max(longest, 4), byH = 58 / lines.length;
    return Math.max(4, Math.min(byW, byH, 30));
  }

  function renderShow() {
    var it = items[cur], il = it.ill;
    elShow.querySelector('.part').textContent = it.part;
    elShow.querySelector('.group').textContent = it.group;
    var p = elShow.querySelector('.phrase'), box = elShow.querySelector('.ill');
    var scrText = il && il.kind !== 'side' ? it.scr.replace(/\\/g, ' ') : it.scr;
    scrText = scrText.replace(/^(\*?)([a-zа-яё])/, function (m, st, ch) { return st + ch.toUpperCase(); });
    p.innerHTML = it.scr === '-' ? '' : fmt(scrText);
    p.style.fontSize = 'min(' + size(it.scr) + 'vw, ' + (size(it.scr) * 1.7) + 'vh)';
    elShow.classList.toggle('has-ill', !!il);
    elShow.classList.toggle('side', !!il && il.kind === 'side');
    elShow.classList.toggle('full', !!il && il.kind === 'full');
    if (!il) box.innerHTML = '';
    else if (il.kind === 'fig') box.innerHTML = fig(il.v, il.arg);
    else if (il.kind === 'pre') box.innerHTML = '<div class="pre">' + esc(il.v) + '</div>';
    else box.innerHTML = '<img src="' + il.v + '" alt="">';
    elShow.querySelector('.say').textContent = it.say;
    elShow.querySelector('.count').textContent = (cur + 1) + ' / ' + items.length;
    elShow.querySelector('.progress').style.width = ((cur + 1) / items.length * 100) + '%';
    var nx = items[cur + 1];
    if (nx && nx.ill && nx.ill.v && nx.ill.kind !== 'fig') { var im = new Image(); im.src = nx.ill.v; }
  }

  function go(i) {
    cur = Math.max(0, Math.min(items.length - 1, i));
    renderShow();
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }
  function start(i) { mode = 'show'; elScript.style.display = 'none'; elShow.style.display = 'block'; go(i); }
  function stop() {
    mode = 'script'; elShow.style.display = 'none'; elScript.style.display = 'block';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    var r = elScript.querySelector('.row[data-i="' + cur + '"]'); if (r) r.scrollIntoView({ block: 'center' });
  }

  document.addEventListener('keydown', function (e) {
    if (mode === 'script') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'ArrowDown' || e.key === 'Enter') { go(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Backspace') { go(cur - 1); e.preventDefault(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(items.length - 1);
    else if (e.key === 'n' || e.key === 'т') elShow.classList.toggle('no-say');
    else if (e.key === 'f' || e.key === 'а') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
    else if (e.key === 'Escape') stop();
  });
  elShow.addEventListener('click', function (e) { go(cur + (e.clientX < window.innerWidth * 0.25 ? -1 : 1)); });

  renderScript();
  var m = /^#(\d+)$/.exec(location.hash);
  if (m) start(+m[1] - 1);
})();
</script>
